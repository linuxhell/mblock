name: Publish mBlock 0.2.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-0.2.1.yml'
      - '.github/release-assets/firefox-signature.part*'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download approved installation packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/13906469155/zip > installation-packages.zip
          mkdir packages
          unzip -q installation-packages.zip -d packages
          find packages -maxdepth 3 -type f -print

      - name: Reconstruct Mozilla-signed Firefox XPI
        run: |
          set -euo pipefail
          cat .github/release-assets/firefox-signature.part00 \
              .github/release-assets/firefox-signature.part01 \
              .github/release-assets/firefox-signature.part02 > signature-metadata.zip
          mkdir signature firefox release
          unzip -q signature-metadata.zip -d signature
          firefox_zip="$(find packages -type f -name 'mblock-firefox-0.2.1.zip' -print -quit)"
          test -n "$firefox_zip"
          unzip -q "$firefox_zip" -d firefox
          cp signature/manifest.json firefox/manifest.json
          rm -rf firefox/META-INF
          cp -R signature/META-INF firefox/META-INF
          (cd firefox && zip -X -q -r ../release/mblock-firefox-0.2.1.xpi .)
          unzip -t release/mblock-firefox-0.2.1.xpi
          test "$(unzip -p release/mblock-firefox-0.2.1.xpi manifest.json | sha256sum | cut -d' ' -f1)" = "31219a21bad02993da312318d5ce6e6974e43006628807a8762ac2ba2ea8aa00"

      - name: Assemble release assets
        run: |
          set -euo pipefail
          for name in mblock-chrome-0.2.1.zip mblock-edge-0.2.1.zip mblock-fontes-0.2.1.zip; do
            src="$(find packages -type f -name "$name" -print -quit)"
            test -n "$src"
            cp "$src" "release/$name"
          done
          (cd release && sha256sum mblock-chrome-0.2.1.zip mblock-edge-0.2.1.zip mblock-firefox-0.2.1.xpi mblock-fontes-0.2.1.zip > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          mBlock 0.2.1

          - Chrome and Edge installation packages.
          - Firefox XPI signed by Mozilla for mblock@linuxhell.github.io.
          - YouTube playback recovery for ads that escape network filters.
          - Improved analysis and application of the YouTube profile to already-open tabs.
          - Diagnostic counters for YouTube playback recovery.
          - Source package and SHA-256 checksums.

          The automated test suite for the approved build passed on workflow run 43135412266.
          Real-world YouTube behavior can still vary by account and experiment.
          EOF
          if gh release view v0.2.1 >/dev/null 2>&1; then
            gh release upload v0.2.1 release/* --clobber
          else
            gh release create v0.2.1 release/* \
              --target 08362e7e7408424f74a040e480feb41ec347844e \
              --title "mBlock 0.2.1" \
              --notes-file release-notes.md
          fi
